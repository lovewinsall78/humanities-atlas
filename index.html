:root{--ink:#172b3d;--muted:#6a7680;--accent:#c67939;--bg:#f7f5f0;--card:#fff;--line:#e8e3da}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;line-height:1.65}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.top{background:#142739;color:#fff;padding:16px max(20px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-family:Georgia,serif;font-size:23px;letter-spacing:-.5px}.top small{display:block;color:#c8d4df;font-size:11px;letter-spacing:2px}.top button{border:1px solid #607386;color:#fff;background:transparent;border-radius:30px;padding:8px 13px}.hero{background:linear-gradient(115deg,#172b3d,#344d60);color:#fff;padding:65px 22px 72px}.hero-inner{max-width:1100px;margin:auto}.eyebrow{color:#e8b884;letter-spacing:3px;font-size:12px}.hero h1{font-family:Georgia,'Noto Serif KR',serif;font-size:clamp(32px,5vw,57px);line-height:1.25;margin:15px 0}.hero p{color:#d7e1e8;max-width:650px}.wrap{max-width:1160px;margin:-30px auto 60px;padding:0 20px}.nav{display:flex;gap:8px;overflow-x:auto;padding:12px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 8px 30px #162b3d0d}.nav button{border:0;background:transparent;border-radius:9px;padding:11px 17px;white-space:nowrap;color:#55626b;font-weight:700}.nav button.active{background:#172b3d;color:white}.section{padding:35px 0}.section h2{font-family:Georgia,'Noto Serif KR',serif;font-size:27px;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 3px 15px #172b3d08}.cardbody{padding:20px}.card h3{margin:6px 0 8px;font-size:18px;line-height:1.4}.card p{color:var(--muted);font-size:14px}.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#b58b64,#2 adding:18px}.map button{margin:5px;background:#fff;border:1px solid #b4c8ba;border-radius:30px;padding:10px 14px}.map button:hover{background:#d9f0d9}.muted{color:var(--muted)}footer{text-align:center;color:#7b8288;padding:35px 20px;border-top:1px solid var(--line)}dialog{border:0;border-radius:15px;max-width:820px;width:calc(100% - 24px);max-height:90vh;overflow:auto;padding:24px;box-shadow:0 20px 70px #0005}dialog::backdrop{background:#101d2bcc}.close{float:right;background:transparent;border:0;font-size:26px}.notice{font-size:13px;background:#fff6e8;padding:12px;border-radius:9px;color:#745330}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}@media(max-width:540px){.grid{grid-template-columns:1fr}.hero{padding:40px 22px 60px}.cardbody{padding:17px}.top{padding:13px 17px}.brand{font-size:19px}.section{padding:25px 0}}
</style></head><body><header class="top"><div><small>HUMANITIES ATLAS</small><div class="brand">인문학 아틀라스</div></div><button onclick="openAccount()" id="accountBtn">로그인 / 회원가입</button></header><div class="hero"><div class="hero-inner"><div class="eyebrow">READ · WATCH · REFLECT</div><h1>한 편의 강연에서<br>한 걸음 더 깊은 사유로.</h1><p>세계사와 철학, 문학과 삶의 지혜를 연결하는 열린 인문학 도서관. 강연을 보고, 질문을 나누고, 마음에 남는 문장을 간직하세요.</p></div></div><main class="wrap"><nav class="nav" id="nav"><button class="active" data-tab="home">🏠 홈</button><button data-tab="library">🎬 강연 도서관</button><button data-tab="courses">📖 학습 커리큘럼</button><button data-tab="explore">🌍 역사 탐험</button><button data-tab="quotes">✨ 영감의 문장</button><button data-tab="mine">📝 나의 서재</button><button data-tab="admin">⚙️ 콘텐츠 관리</button></nav><div id="content"></div></main><footer>인문학 아틀라스 · 독립 학습 프로젝트<br><small>강연 영상의 저작권은 각 원저작자에게 있습니다. 공식 북클럽과 제휴·운영 관계가 아닙니다.</small></footer><dialog id="modal"><button class="close" onclick="modal.close()">×</button><div id="modalBody"></div></dialog><div id="toast" style="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#173b32;color:white;padding:10px 20px;border-radius:40px;display:none;z-index:20"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// 운영 전 이 두 값은 공개용 프로젝트 URL과 publishable/anon 키로 교체하세요. service_role 키는 절대 입력하지 마세요.

{id:'mid-east',title:'중동은 왜 싸우는가 | 유대인 3천년 역사의 오해와 진실',category:'역사',speaker:'박현도 교수 · 1% 북클럽',video_id:'fxnhglLzZAU',description:'중동의 역사와 종교·정치적 갈등을 살펴보는 강연. 영상 시청 후 시대별 사건과 다양한 관점을 비교해 보세요.',questions:['유대교와 이슬람교는 어떤 역사적 접점을 갖고 있을까?','근대 민족주의와 제국주의는 갈등에 어떤 영향을 미쳤을까?'],quiz:[{q:'1917년 영국이 팔레스타인 내 유대인 민족의 고향 설립 지지를 표명한 문서는?',options:['벨푸어 선언','베르사유 조약','포츠담 선언'],answer:0,why:'벨푸어 선언은 1917년 발표되었습니다.'}]},

const starterQuotes=[{id:'q1',text:'좋은 질문은 우리가 당연하게 여긴 것을 다시 바라보게 한다.',author:'인문학 아틀라스 편집 문장',category:'사유'},{id:'q2',text:'오늘의 작은 실천이 내일의 삶을 조금씩 바꾼다.',author:'인문학 아틀라스 편집 문장',category:'성장'},{id:'q3',text:'한 권의 책은 다른 사람의 삶을 이해하는 문이 될 수 있다.',author:'인문학 아틀라스 편집 문장',category:'독서'}];
const key='humanities_atlas_public_v2';let state=JSON.parse(localStorage.getItem(key)||'{}');state.lessons??=starter;state.quotes??=starterQuotes;state.favorites??=[];state.notes??={};state.done??=[];let tab='home',client=null,user=null,role='reader',remote=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(key,JSON.stringify(state));function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2400)}function show(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo({top:220,behavior:'smooth'})}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));function thumb(l){return l.video_id?`<img loading="lazy" src="https://i.ytimg.com/vi/${encodeURIComponent(l.video_id)}/hqdefault.jpg" alt="">`:'📚'}function card(l){return `<article class="card"><div class="thumb">${thumb(l)}</div><div class="cardbody"><span class="tag">${esc(l.category)}</span><h3>${esc(l.title)}</h3><p>${esc(l.speaker||'')}</p><div class="row"><button class="btn" onclick="lesson('${esc(l.id)}')">학습하기 →</button><button class="btn secondary" onclick="favorite('${esc(l.id)}')">${state.favorites.includes(l.id)?'★ 저장됨':'☆ 저장'}</button></div></div></article>`}function render(){let html='';if(tab==='home'){html=`<section class="section"><h2>오늘의 인문학</h2><p class="sub">읽고, 보고, 기록하는 작은 습관</p><div class="panel"><span class="tag">오늘의 생각</span><h2>“${esc(state.quotes[0]?.text||'오늘 무엇을 배웠나요?')}”</h2><p class="muted">${esc(state.quotes[0]?.author||'')}</p><button class="btn" onclick="copyText(state.quotes[0]?.text||'')">📋 문장 복사</button></div><div class="row"><span class="pill">강연 ${state.lessons.length}편</span><span class="pill">학습 완료 ${state.done.length}편</span><span class="pill">저장 문장 ${state.quotes.length}개</span></div></section><section class="section"><h2>추천 강연</h2><p class="sub">관심 있는 강연을 골라 학습을 시작해 보세요.</p><div class="grid">${state.lessons.slice(0,6).map(card).join('')}</div></section>`}if(tab==='library'){html=`<section class="section"><h2>강연 도서관</h2><p class="sub">주제별로 강연을 탐색하고 원본 영상으로 연결합니다.</p><div class="filters"><input id="search" placeholder="강연·책·주제 검색" oninput="filterLessons()"><select id="category" onchange="filterLessons()"><option value="">전체 주제</option>${[...new Set(state.lessons.map(x=>x.category))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class="grid" id="lessonGrid">${state.lessons.map(card).join('')}</div></section>`}if(tab==='courses'){html=`<section class="section"><h2>학습 커리큘럼</h2><p class="sub">영상 시청 → 핵심 질문 → 확인 퀴즈 → 나의 생각 기록</p><div class="grid">${state.lessons.map(card).join('')}</div></section>`}if(tab==='explore'){html=`<section class="section"><h2>역사 탐험</h2><p class="sub">시대와 지역을 연결하는 학습 안내 · 실제 축척 지도가 아닌 주제 탐색입니다.</p><div class="panel"><h3>중동 역사의 주요 장면</h3><div class="timeline"><p><b>기원전 539년</b><br>키루스 2세의 바빌론 정복과 유배민 귀환 허용</p><p><b>1517년</b><br>오스만 제국의 레반트 지역 지배</p><p><b>1916~1917년</b><br>사이크스–피코 협정과 벨푸어 선언</p><p><b>1948년</b><br>이스라엘 건국과 팔레스타인인의 대규모 피난·추방(나크바)</p><p><b>1953년</b><br>이란 모사데크 정권 전복</p><p><b>1979년</b><br>이란 혁명과 미·이란 관계 악화</p></div></div><div class="map"><h3>지역별 학습 주제</h3>${[['튀르키예','오스만 제국과 제국의 통치'],['이스라엘·팔레스타인','민족주의와 영토 문제'],['이라크','메소포타미아 문명'],['이란','페르시아 역사와 현대 정치'],['호르무즈 해협','에너지 운송과 국제관계']].map(x=>`<button onclick="$('#regionInfo').textContent='${x[0]} — ${x[1]}'">${x[0]}</button>`).join('')}<p id="regionInfo" class="status">지역을 선택해 보세요.</p></div></section>`}if(tab==='quotes'){html=`<section class="section"><h2>영감의 문장</h2><p class="sub">마음에 남는 문장을 복사하고 공유하세요. 출처가 확인되지 않은 문장은 인용문으로 표시하지 않습니다.</p><div class="grid">${state.quotes.map(q=>`<div class="card quote"><span class="tag">${esc(q.category||'영감')}</span><blockquote>“${esc(q.text)}”</blockquote><small>${esc(q.author)}</small><div class="row" style="margin-top:18px"><button class="btn" onclick="copyQuote('${esc(q.id)}')">📋 복사</button><button class="btn secondary" onclick="shareQuote('${esc(q.id)}')">↗ 공유</button></div></div>`).join('')}</div>${role==='admin'?`<div class="panel" style="margin-top:22px"><h3>새 문장 등록</h3><form onsubmit="addQuote(event)"><label>문장<input class="field" name="text" required maxlength="500"></label><label>출처 또는 작성자<input class="field" name="author" required></label><label>분류<input class="field" name="category" value="사유"></label><button class="btn">공개 문장 등록</button></form></div>`:''}</section>`}if(tab==='mine'){html=`<section class="section"><h2>나의 서재</h2><p class="sub">즐겨찾기와 메모는 ${remote?'계정에':'현재 브라우저에'} 저장됩니다.</p>${!user?'<div class="notice">로그인하면 공개 서비스에서도 기기 간 학습 기록을 동기화할 수 있습니다. 서버 미설정 시에는 브라우저에만 저장됩니다.</div>':''}<div class="panel"><h3>즐겨찾기</h3><div class="grid">${state.lessons.filter(l=>state.favorites.includes(l.id)).map(card).join('')||'<div class="empty">아직 저장한 강연이 없습니다.</div>'}</div></div><div class="panel"><h3>나의 메모</h3>${Object.entries(state.notes).map(([id,n])=>`<p><b>${esc(state.lessons.find(l=>l.id===id)?.title||id)}</b><br>${esc(n)}</p>`).join('')||'<p class="muted">강의 학습 화면에서 메모를 작성하세요.</p>'}</div><div class="row"><button class="btn" onclick="backup()">💾 내 기록 백업</button><label class="btn secondary" style="cursor:pointer">📂 백업 복원<input type="file" accept="application/json" hidden onchange="restore(event)"></label></div></section>`}if(tab==='admin'){html=`<section class="section"><h2>콘텐츠 관리</h2><p class="sub">공개 사이트에서는 승인된 관리자만 강연을 등록하거나 수정할 수 있습니다.</p>${role!=='admin'?'<div class="notice">현재 관리자 권한이 없습니다. Supabase에서 관리자 권한을 부여한 계정으로 로그인하세요. 미연결 데모에서는 관리 기능이 잠겨 있습니다.</div>':`<div class="panel"><h3>새 강연 등록</h3><form onsubmit="addLesson(event)"><label>강연 제목<input class="field" name="title" required></label><label>유튜브 주소 또는 영상 ID<input class="field" name="url" required></label><label>분류<select class="field" name="category"><option>역사</option><option>철학</option><option>문학</option><option>경제</option><option>자기계발</option><option>삶</option><option>종교</option></select></label><label>강연자·채널<input class="field" name="speaker" value="1% 북클럽"></label><label>강연 소개<textarea class="field" name="description"></textarea></label><label>학습 질문 (줄바꿈으로 구분)<textarea class="field" name="questions"></textarea></label><button class="btn">강연 공개 등록</button></form></div><div class="panel"><h3>강연 관리</h3>${state.lessons.map(l=>`<p>${esc(l.title)} <button class="btn outline" onclick="removeLesson('${esc(l.id)}')">삭제</button></p>`).join('')}</div>`}<div class="panel"><h3>채널 콘텐츠 관리 안내</h3><p>공개 영상 목록을 자동으로 모두 가져오려면 별도 YouTube Data API 연결이 필요합니다. 영상 설명·자막의 이용 가능 여부와 저작권을 검토한 뒤 학습자료를 공개하세요.</p><a href="${CHANNEL}" target="_blank" rel="noopener">공식 채널 방문 ↗</a></div></section>`}$('#content').innerHTML=html}function filterLessons(){let q=$('#search').value.toLowerCase(),c=$('#category').value;let ls=state.lessons.filter(l=>(!c||l.category===c)&&[l.title,l.speaker,l.description].join(' ').toLowerCase().includes(q));$('#lessonGrid').innerHTML=ls.map(card).join('')||'<div class="empty">검색 결과가 없습니다.</div>'}function getVideoId(s){try{let u=new URL(s);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1).split('/')[0];if(u.hostname.includes('youtube.com'))return u.searchParams.get('v')||u.pathname.split('/').pop()}catch(e){}return /^[\w-]{11}$/.test(s)?s:''}function lesson(id){let l=state.lessons.find(x=>x.id===id);if(!l)return;$('#modalBody').innerHTML=`<span class="tag">${esc(l.category)}</span><h2>${esc(l.title)}</h2><p class="muted">${esc(l.speaker||'')}</p>${l.video_id?`<iframe class="video" loading="lazy" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(l.video_id)}" title="강연 영상" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe><p><a href="https://www.youtube.com/watch?v=${encodeURIComponent(l.video_id)}" target="_blank" rel="noopener">유튜브에서 보기 ↗</a></p>`:'<div class="notice">이 강연은 아직 영상 주소가 등록되지 않았습니다. 채널에서 원본 영상을 찾아보세요.</div>'}<h3>강의 소개</h3><p>${esc(l.description)}</p><h3>생각할 질문</h3><ol>${(l.questions||[]).map(q=>`<li>${esc(q)}</li>`).join('')}</ol><h3>확인 퀴즈</h3>${(l.quiz||[]).length?l.quiz.map((q,i)=>`<div class="panel"><b>${esc(q.q)}</b>${q.options.map((o,j)=>`<button class="quiz-option" onclick="quizAnswer('${esc(id)}',${i},${j})">${esc(o)}</button>`).join('')}<p id="answer-${i}"></p></div>`).join(''):'<p class="muted">검증된 퀴즈가 아직 등록되지 않았습니다.</p>'}<h3>나의 생각</h3><textarea id="note" class="field" placeholder="강연을 듣고 떠오른 생각을 기록해 보세요">${esc(state.notes[id]||'')}</textarea><div class="row"><button class="btn" onclick="saveNote('${esc(id)}')">메모 저장</button><button class="btn secondary" onclick="markDone('${esc(id)}')">${state.done.includes(id)?'✓ 학습 완료':'학습 완료 표시'}</button></div>`;$('#modal').showModal()}function quizAnswer(id,i,j){let q=state.lessons.find(l=>l.id===id).quiz[i];$('#answer-'+i).textContent=j===q.answer?'⭕ 정답! '+q.why:'다시 생각해 보세요.'}async function saveNote(id){state.notes[id]=$('#note').value;save();await syncProgress(id);toast('메모가 저장되었습니다')}async function markDone(id){if(!state.done.includes(id))state.done.push(id);save();await syncProgress(id);toast('학습 완료로 표시했습니다');lesson(id)}async function favorite(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();await syncProgress(id);render()}function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast('복사했습니다')).catch(()=>fallbackCopy(t))||fallbackCopyIfMissing(t)}function fallbackCopyIfMissing(t){if(!navigator.clipboard)fallbackCopy(t)}function fallbackCopy(t){let el=document.createElement('textarea');el.value=t;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();toast('복사했습니다')}function copyQuote(id){let q=state.quotes.find(x=>x.id===id);copyText('“'+q.text+'”\n— '+q.author)}async function shareQuote(id){let q=state.quotes.find(x=>x.id===id),text='“'+q.text+'”\n— '+q.author;if(navigator.share){try{await navigator.share({title:'인문학 아틀라스',text})}catch(e){}}else copyText(text)}function backup(){let b=new Blob([JSON.stringify({favorites:state.favorites,notes:state.notes,done:state.done},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='인문학_아틀라스_내기록.json';a.click();URL.revokeObjectURL(a.href)}async function restore(e){try{let d=JSON.parse(await e.target.files[0].text());state.favorites=Array.isArray(d.favorites)?d.favorites:[];state.notes=d.notes&&typeof d.notes==='object'?d.notes:{};state.done=Array.isArray(d.done)?d.done:[];save();render();toast('복원했습니다')}catch(err){toast('올바른 백업 파일이 아닙니다')}}function openAccount(){$('#modalBody').innerHTML=`<h2>계정 로그인</h2>${!client?'<div class="notice">현재는 데모 모드입니다. 공개 회원 기능은 Supabase 연결 후 활성화됩니다.</div>':user?`<p>${esc(user.email)}</p><button class="btn" onclick="logout()">로그아웃</button>`:`<label>이메일<input id="email" type="email" class="field" autocomplete="email"></label><label>비밀번호<input id="password" type="password" class="field" autocomplete="current-password"></label><div class="row"><button class="btn" onclick="auth('signin')">로그인</button><button class="btn secondary" onclick="auth('signup')">회원가입</button></div><p class="muted">회원가입 시 이메일 확인이 필요할 수 있습니다.</p>`}`;$('#modal').showModal()}async function auth(mode){let email=$('#email').value,password=$('#password').value;if(!email||!password)return toast('이메일과 비밀번호를 입력하세요');let r=mode==='signup'?await client.auth.signUp({email,password}):await client.auth.signInWithPassword({email,password});if(r.error)return toast(r.error.message);if(mode==='signup')return toast('가입 신청 완료. 이메일을 확인하세요.');await loadUser();$('#modal').close();render()}async function logout(){await client.auth.signOut();user=null;role='reader';remote=false;state.favorites=[];state.notes={};state.done=[];save();$('#modal').close();render();$('#accountBtn').textContent='로그인 / 회원가입'}async function loadUser(){if(!client)return;let {data:{user:u}}=await client.auth.getUser();user=u;role='reader';remote=false;if(u){let {data}=await client.from('profiles').select('role').eq('id',u.id).maybeSingle();role=data?.role==='admin'?'admin':'reader';let r=await client.from('user_progress').select('*').eq('user_id',u.id);if(!r.error){state.favorites=r.data.filter(x=>x.favorite).map(x=>x.lesson_id);state.done=r.data.filter(x=>x.completed).map(x=>x.lesson_id);state.notes=Object.fromEntries(r.data.filter(x=>x.note).map(x=>[x.lesson_id,x.note]));remote=true;save()}}$('#accountBtn').textContent=u?(role==='admin'?'관리자 · ':'내 계정 · ')+u.email.split('@')[0]:'로그인 / 회원가입'}async function syncProgress(id){if(!client||!user)return;let {error}=await client.from('user_progress').upsert({user_id:user.id,lesson_id:id,favorite:state.favorites.includes(id),completed:state.done.includes(id),note:state.notes[id]||''},{onConflict:'user_id,lesson_id'});if(error)toast('서버 저장 오류: '+error.message)}async function addLesson(e){e.preventDefault();if(role!=='admin')return;let f=new FormData(e.target),id=getVideoId(f.get('url'));if(!id)return toast('유효한 유튜브 영상 주소를 입력하세요');let item={id:crypto.randomUUID(),title:f.get('title'),video_id:id,category:f.get('category'),speaker:f.get('speaker'),description:f.get('description'),questions:f.get('questions').split('\n').filter(Boolean),quiz:[]};if(client){let {error}=await client.from('lessons').insert(item);if(error)return toast(error.message)}state.lessons.unshift(item);save();toast('강연을 등록했습니다');render()}async function removeLesson(id){if(role!=='admin'||!confirm('강연을 삭제하시겠습니까?'))return;if(client){let {error}=await client.from('lessons').delete().eq('id',id);if(error)return toast(error.message)}state.lessons=state.lessons.filter(x=>x.id!==id);save();render()}async function addQuote(e){e.preventDefault();if(role!=='admin')return;let f=new FormData(e.target),q={id:crypto.randomUUID(),text:f.get('text'),author:f.get('author'),category:f.get('category')};if(client){let {error}=await client.from('quotes').insert(q);if(error)return toast(error.message)}state.quotes.unshift(q);save();render();toast('문장을 등록했습니다')}async function init(){if(CONFIG.supabaseUrl&&CONFIG.supabaseAnonKey&&window.supabase){client=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey);let [a,b]=await Promise.all([client.from('lessons').select('*').order('created_at',{ascending:false}),client.from('quotes').select('*').order('created_at',{ascending:false})]);if(!a.error&&a.data.length)state.lessons=a.data;if(!b.error&&b.data.length)state.quotes=b.data;save();await loadUser();client.auth.onAuthStateChange(()=>setTimeout(()=>loadUser().then(render),0))}render()}init();
</script></body></html>
